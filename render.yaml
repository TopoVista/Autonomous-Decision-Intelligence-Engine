version: "1"

services:
  - type: web
    name: ask-database-analyst
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    numInstances: 1

    envVars:
      # ── Required secrets (set in Render dashboard, never commit) ──────────
      - key: OPENAI_API_KEY
        sync: false          # injected from Render environment group

      # ── App tuning ────────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        sync: false          # managed PostgreSQL URL; never fall back to SQLite in production

      - key: LOG_LEVEL
        value: warning       # reduce noise / memory overhead in prod

      - key: PYTHONOPTIMIZE
        value: "1"
